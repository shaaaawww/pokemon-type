  }
  function stageLabel(stage) { return `<div class="stage-dots"><span class="${stage==='primary'?'active':'complete'}">01 · Core identity</span><span class="stage-separator">/</span><span class="${stage==='secondary'?'active':stage==='results'?'complete':''}">02 · Eight lenses</span><span class="stage-separator">/</span><span class="${stage==='results'?'active':''}">03 · Your typing</span></div>`; }
  function progress(stage,idx,length) { const overall=stage==='primary'?idx:PRIMARY.length+idx; return `<div class="step-head"><span class="step-kicker">${stage==='primary'?'Stage 01 · Your main type':'Stage 02 · Secondary refinement'}</span><span class="step-count">${idx+1} / ${length} <span class="muted">·</span> ${overall+1} / ${TOTAL} total</span></div><div class="progress-track" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuemax="${TOTAL}" aria-valuenow="${overall}"><div class="progress-fill" style="width:${overall/TOTAL*100}%"></div></div>`; }
  function intro() {
    const started=state.primaryAnswers.some(x=>x!==null);
    const typeTiles=TYPES.map(type=>`<button type="button" class="hero-type" data-action="preview-theme" data-type="${type}" style="--tile-color:${TYPE_INFO[type].color}" aria-label="Preview ${type} theme" aria-pressed="${type===previewTheme}"><span class="hero-type-mark" aria-hidden="true">${TYPE_INFO[type].mark}</span><span>${type}</span></button>`).join('');
    return `<section class="hero"><div class="hero-copy"><div class="eyebrow">Pokémon Type Quiz</div><h1>Find your <span class="gradient-text">Pokémon type.</span></h1><p class="lead">Which Pokémon type matches your personality? Discover your main type, see if a second type fits, and find the starter Pokémon that makes the best partner for you.</p><div class="hero-statline"><span class="pill">18 Pokémon types</span><span class="pill">50 main questions</span><span class="pill">30 refinement questions</span><span class="pill">10–15 minutes</span></div><div class="actions"><button class="btn btn-primary" data-action="start">${started?'Continue your quiz':'Start the quiz'} <span aria-hidden="true">→</span></button>${started?'<button class="btn btn-ghost" data-action="reset">Start over</button>':''}</div></div><div class="hero-art" aria-label="All eighteen Pokémon types"><div class="art-heading"><span class="art-heading-label"><span class="art-orbit-dot" aria-hidden="true"></span> THE 18 TYPES</span><span class="art-current" id="theme-name" aria-live="polite">${previewTheme} theme</span></div><div class="hero-type-grid">${typeTiles}</div><p class="art-footnote">Select a type to preview its theme. Your quiz result determines your final type.</p></div></section>
    <section class="info-grid" aria-label="How the quiz works"><div class="info-card"><div class="info-number">01 / DISCOVER</div><h3>Find your main type</h3><p>Pick your favorite Pokémon game, then answer 49 personality questions to discover your strongest match across all 18 types.</p></div><div class="info-card"><div class="info-number">02 / REFINE</div><h3>Test eight traits</h3><p>30 questions explore instincts, abilities, environment, adaptations, expression, mythology, energy, and how you face challenges—plus eight similar-type comparisons.</p></div><div class="info-card"><div class="info-number">03 / MATCH</div><h3>Reveal your typing and starter</h3><p>Get one type or a supported pair, your personalized breakdown, and a starter recommendation shaped by your answers and favorite game.</p></div></section>`;
  }
  function gameQuestionScreen() {
    const selected=state.primaryAnswers[0];
    const groups=GAME_GROUPS.map(group=>`<optgroup label="${escapeHTML(group.label)}">${group.items.map(g=>`<option value="${escapeHTML(g.id)}" ${selected===g.id?'selected':''}>${escapeHTML(g.name)}${g.year?' · '+g.year:''}</option>`).join('')}</optgroup>`).join('');
    return `<div class="question-layout">${stageLabel('primary')}${progress('primary',0,PRIMARY.length)}<div class="question-box"><div class="question-label">Question 01 · your Pokémon journey</div><h2 class="question-title" id="question-title">What is your favorite Pokémon game ever made?</h2><p class="question-helper">Pick the game that means the most to you—even if it's a remake or spin-off. This sets your Pokémon era and a nostalgic starter shortlist, but does <strong>not</strong> determine your personality type. Release years describe games, not your age.</p><label class="game-label" for="game-select">Your favorite game</label><select class="game-select" id="game-select" aria-labelledby="question-title"><option value="">Choose your Pokémon game…</option>${groups}</select><div class="game-context" id="game-context">${selected?gameContext(selected):'Your starter recommendations will be matched to the game you pick.'}</div><div class="question-footer"><button class="btn btn-ghost" data-action="back">← Back</button><button class="btn btn-primary" data-action="game-next" ${!selected?'disabled':''}>Next question →</button></div></div><div class="principle"><strong>Your partner, your journey.</strong> You don't need to look like a type or prefer its element to embody its traits. The quiz looks for what you are, what you do, and what you symbolize.</div></div>`;
  }
  function gameContext(id) {
    const g=GAMES.find(x=>x.id===id);
    if(!g) return 'Your game choice will guide your starter shortlist.';
    const era=g.year?`${g.year} release · `:'';
    const pool=g.pool && STARTER_POOLS[g.pool];
    return `${era}${g.gen?`Generation ${g.gen} · `:''}${pool?`${g.pool==='KantoYellow'?'Yellow-era partner pool':'Starter baseline'}: ${pool.join(' / ')}`:'Starter choices will span the main-series regions'}.`;
  }
  function promptScreen(stage) {
    const isCore=stage==='primary';
    const idx=isCore?state.primaryIndex:state.secondaryIndex;
    const items=isCore?PRIMARY:SECONDARY;
    const q=items[idx];
    const answer=(isCore?state.primaryAnswers:state.secondaryAnswers)[idx];
    if (isCore && q.kind==='game') return gameQuestionScreen();
    let choices='';
    if (isCore) {
      const names=['Not like me','Rarely like me','Sometimes like me','Often like me','Very much like me'];
      choices=names.map((n,i)=>choiceHTML(n,i,answer)).join('');
    } else if(q.contrast) {
      const names=['Strongly A','Leaning A','Neither feels right','Leaning B','Strongly B'];
      choices=names.map((n,i)=>choiceHTML(n,i,answer)).join('');
    } else {
      choices=q.options.map((o,i)=>choiceHTML(o[0],i,answer)).join('');
    }
    const questionText=isCore?q.text:q.text;
    const helper = isCore ? 'Answer based on what is consistently true of you—not what you wish were true. There are no good or bad types.' : q.contrast ? 'Choose the distinction that best describes your actual tendencies. “Neither” is valid if neither fits.' : 'Choose the option that best describes your default behavior, not simply your favorite aesthetic.';
    const contrast=q.contrast ? `<div class="contrast-pair"><div class="contrast-side"><strong>A</strong><p>${escapeHTML(q.a)}</p></div><div class="contrast-side"><strong>B</strong><p>${escapeHTML(q.b)}</p></div></div>` : '';
    return `<div class="question-layout">${stageLabel(stage)}${progress(stage,idx,items.length)}<div class="question-box"><div class="question-label">${isCore?'Core identity · what you are, do, and symbolize':escapeHTML(q.lensName)+' · '+escapeHTML(q.lensSub)}</div><h2 class="question-title" id="question-title">${escapeHTML(questionText)}</h2><p class="question-helper">${escapeHTML(helper)}</p>${contrast}<div class="choices" role="group" aria-labelledby="question-title">${choices}</div><div class="question-footer"><button class="btn btn-ghost" data-action="back">← Back</button><span class="keyboard-tip">Press ${q.contrast || isCore?'1–5':'1–4'} to answer · Auto-advance</span></div></div><div class="principle"><strong>Remember:</strong> a type comes from more than appearance or one isolated ability. Focus on your patterns of behavior, strengths, environment, and symbolism.</div></div>`;
  }
  function choiceHTML(text,i,answer) { return `<button type="button" class="choice ${answer===i?'selected':''}" data-answer="${i}" aria-pressed="${answer===i}"><span class="choice-index">${i+1}</span><span>${escapeHTML(text)}</span></button>`; }
  function typeLabel(type) { return `<span class="type-label" ${theme(type)}><span class="dot"></span>${type} type</span>`; }
  function identityStrip(primary) { const info=TYPE_INFO[primary]; return `<div class="summary-strip"><div class="summary-bit"><div class="label">What you are</div><p>${escapeHTML(info.essence)}</p></div><div class="summary-bit"><div class="label">What you do</div><p>${escapeHTML(info.do)}</p></div><div class="summary-bit"><div class="label">What you symbolize</div><p>${escapeHTML(info.symbol)}</p></div></div>`; }
  function interlude() {
    const ranked=coreResults(), main=ranked[0].type, info=TYPE_INFO[main];
    const close=ranked[0].pct-ranked[1].pct<=.0834;
    return `<section class="interlude">${stageLabel('secondary')}<div class="eyebrow">Stage one complete</div><h2>Your main type is taking shape.</h2><div class="type-sigil" ${theme(main)} aria-hidden="true">${info.mark}</div><div>${typeLabel(main)}</div><div class="big-type" ${theme(main)} style="color:${info.color}">${main}</div><p class="lead">Based on 50 questions, <strong>${main}</strong> is your strongest primary-type pattern. This is a provisional typing until the eight-lens refinement is complete.</p>${close?`<div class="callout"><strong>Close result:</strong> ${main} and ${ranked[1].type} scored very similarly. Your primary type is a best-fit interpretation, not a definitive measurement.</div>`:''}${identityStrip(main)}<div class="highlight-panel"><h3>Next: does a second type actually fit?</h3><p>You'll answer 30 questions across eight attributes: <strong>biology, natural ability, environment, adaptation, physical form, mythology, elemental power, and combat identity</strong>. Eight questions directly separate commonly confused types. A secondary type is awarded only when multiple attributes support it and the first stage agrees. If the evidence is weak or ambiguous, you remain a single type.</p></div><div class="actions"><button class="btn btn-primary" data-action="continue-secondary">Refine my typing →</button><button class="btn btn-ghost" data-action="back">← Revisit last answer</button></div></section>`;
  }
  function typeTile(type,role) { return `<div class="type-tile" ${theme(type)}><span class="topline">${role}</span><span class="name">${type}</span></div>`; }
  function contrastSummary() {
    const contrasts=SECONDARY.map((q,i)=>({...q,index:i})).filter(q=>q.contrast);
    return `<details class="print-hide"><summary>See the eight close-type distinctions you answered</summary><p class="small muted">Aesthetics alone don't determine type. These items distinguish the underlying traits behind similar-looking types.</p><div class="compare-list">${contrasts.map((q,i)=>{
      const a=state.secondaryAnswers[q.index];
      const decision=a===2?'Neither':a<2?q.contrast[0]+(a===0?' strongly':' slightly'):q.contrast[1]+(a===4?' strongly':' slightly');
      return `<div class="compare-item"><div><strong>${q.contrast.join(' vs. ')}</strong><div class="small muted">${CONTRAST_COPY[i]}</div></div><span>${escapeHTML(decision)}</span></div>`;
    }).join('')}</div></details>`;
  }
  function results() {
    const core=coreResults(), r=secondaryResults(), primary=r.primary, second=r.secondary;
    const close=core[0].pct-core[1].pct<=.0834;
    const badge=second?'Supported dual typing':'Single-type identity';
    const primaryInfo=TYPE_INFO[primary];
    const bars=core.slice(0,5).map(c=>`<div><div class="bar-head"><strong>${c.type}</strong><span>${Math.round(c.pct*100)} / 100</span></div><div class="bar-bg"><div class="bar-fill" style="--type-color:${TYPE_INFO[c.type].color};width:${Math.round(c.pct*100)}%"></div></div></div>`).join('');
    let rationale;
    if (second) {
      const info=TYPE_INFO[second];
      rationale=`<p><strong>${second}</strong> emerged repeatedly from your second-stage choices across <strong>${r.best.lenses.length} different identity attributes</strong>, and your first-stage answers also supported it. It wasn't added simply because its aesthetic appealed to you.</p><div class="lens-chips">${r.best.lenses.map(l=>`<span class="lens-chip">${escapeHTML(l)}</span>`).join('')}</div><p><strong>Its contribution:</strong> ${escapeHTML(info.essence)} ${escapeHTML(info.symbol)}</p>`;
    } else {
      rationale=`<p>No additional type met the evidence standard. To earn a second type, one contender must be chosen repeatedly across several identity attributes, have support from the main-type quiz, and stand clearly ahead of other contenders.</p><p>Your closest secondary influence was <strong>${r.best.type}</strong>, but its evidence was not strong or distinct enough to justify a dual type. <strong>Being single-type is a positive, complete outcome—not an incomplete result.</strong></p>`;
    }
    return `<section class="results">${stageLabel('results')}<div class="result-top"><div class="eyebrow">Your complete type profile</div><h2>${second?'Two sides. One identity.':'One clear identity.'}</h2><p class="muted">${badge} · based on ${TOTAL} questions</p><div class="result-types">${typeTile(primary,'Main type')}${second?'<span class="plus" aria-label="plus">+</span>'+typeTile(second,'Secondary type'):''}</div>${close?`<p class="callout"><strong>Close primary result:</strong> ${primary} and ${core[1].type} were separated by less than one response step on the core scale. Treat your top choice as a best fit, not a definitive assignment.</p>`:''}<p class="result-note">${second ? `${primaryInfo.essence} ${TYPE_INFO[second].do}` : `${primaryInfo.essence} ${primaryInfo.do}`}</p></div>
    <section class="result-section"><h3>The three foundations of your identity</h3><p>Typing reflects the interaction between your nature, what you're capable of, and what your traits represent—not physical resemblance, preferred colors, or isolated abilities.</p>${identityStrip(primary)}${second?`<p><strong>Your ${second} dimension:</strong> ${escapeHTML(TYPE_INFO[second].do)} ${escapeHTML(TYPE_INFO[second].symbol)}</p>`:''}</section>
    <section class="result-section"><h3>Why ${second?'two types':'one type'}?</h3>${rationale}<p class="micro-note">The refinement required repeated choices across multiple lenses, corroborating core answers, and a clear margin over alternatives. The refinement considered four paired patterns: biology + natural ability, environment + adaptation, physical form + mythology, and elemental power + combat identity.</p></section>
    <section class="result-section"><h3>What your core answers favored</h3><p>Your top five primary-stage alignments. These are relative agreement scores, not a statistical probability or a scientific measurement of personality.</p><div class="bars">${bars}</div><p class="micro-note">The primary type is determined only in stage one. Stage two cannot replace it; it can only provide enough independent evidence to add one secondary type.</p></section>
    <section class="result-section"><h3>Similar types aren't interchangeable</h3><p>Rock is not simply Ground; Ghost isn't automatically Dark; Fairy isn't merely Psychic; Flying doesn't necessarily mean Dragon. The close-call questions tested these conceptual boundaries rather than asking which aesthetic you liked best.</p>${contrastSummary()}</section>
    <div class="callout"><strong>Interpretation note:</strong> This is a fictional, metaphorical framework—not a psychological diagnosis. Dark suggests strategy, not wrongdoing; Poison suggests sensitivity to risk, not toxicity. No trait, skill, habitat, or appearance automatically makes a person a type. The most convincing result is the identity that coherently connects what you are, what you do, and what you symbolize.</div>
    ${starterResultHTML(r)}
    <div class="actions print-hide"><button class="btn btn-primary" data-action="copy">Copy my type result</button><button class="btn btn-outline" data-action="print">Print / save as PDF</button><button class="btn btn-ghost" data-action="reset">Retake quiz</button></div><p id="copy-feedback" class="small muted" role="status" aria-live="polite"></p></section>`;
  }
  function applyTheme(type) {
    const info=TYPE_INFO[type] || TYPE_INFO.Normal;
    const isDark=document.documentElement.dataset.appearance==='dark';
    document.documentElement.style.setProperty('--live-color',info.color);
    document.documentElement.style.setProperty('--live-bright',isDark?`color-mix(in srgb, ${info.color} 70%, white)`:`color-mix(in srgb, ${info.color} 32%, #17283f)`);
    document.documentElement.style.setProperty('--live-shade',isDark?`color-mix(in srgb, ${info.color} 67%, #9db1cb)`:`color-mix(in srgb, ${info.color} 60%, #586d87)`);
    document.documentElement.dataset.theme=type.toLowerCase();
    const active=app.querySelectorAll('.hero-type');
    active.forEach(el=>{
      const selected=el.dataset.type===type;
      el.classList.toggle('hero-type-active',selected);
      el.setAttribute('aria-pressed',String(selected));
    });
    const name=app.querySelector('#theme-name');
    if(name) name.textContent=type+' theme';
  }
  const APPEARANCE_KEY='pokemon-type-quiz-appearance-v1';
  function setAppearance(mode) {
    mode=mode==='dark'?'dark':'light';
    document.documentElement.dataset.appearance=mode;
    document.querySelectorAll('[data-appearance-choice]').forEach(button=>{
      button.setAttribute('aria-pressed',String(button.dataset.appearanceChoice===mode));
    });
    const meta=document.querySelector('meta[name="theme-color"]');
    if(meta) meta.content=mode==='dark'?'#0c111d':'#f4f6fa';
    try {localStorage.setItem(APPEARANCE_KEY,mode);} catch {}
    // Do not change the selected Pokémon type, quiz answers, or result.
    applyTheme(state.screen==='results'?secondaryResults().primary:state.screen==='intro'?previewTheme:'Normal');
  }
  function starterResultHTML(r) {
    const pick=starterMatch(r), s=pick.best, game=pick.game;
    const color=TYPE_INFO[s.element].color;
    const anchors=pick.aligned.length ? `Your strongest shared traits are <strong>${pick.aligned.join(' and ')}</strong>.` : 'Its temperament connects with the recurring patterns in your answers.';
    const era=game?.year?`${game.year} nostalgia`:'All generations';
    const gameNote=game && game.id!=='none' && game.id!=='another'?`Because you chose <strong>${escapeHTML(game.name)}</strong>, your recommendation comes from ${escapeHTML(pick.stageName)}.`:`With no specific game-era starter pool, your match was selected from the 27 original regional starters.`;
    return `<section class="starter-card" style="--starter-color:${color}" aria-labelledby="starter-title"><div class="starter-top"><div class="starter-kicker">Bonus result · Your perfect starter match</div><span class="starter-icon" aria-hidden="true">${TYPE_INFO[s.element].mark}</span></div><div class="starter-body"><h3 class="starter-name" id="starter-title">${escapeHTML(s.name)}</h3><div class="starter-meta"><span>${s.element} starter</span><span>${escapeHTML(pick.stageName)}</span><span>${escapeHTML(era)}</span></div><p>${escapeHTML(s.vibe)} ${anchors}</p><p>${gameNote} Your main-type answers, refinement choices, and personality patterns determine which partner within that starter pool fits best.</p><p class="starter-disclaimer">This is a personalized fan-made starter recommendation based on the same 80 questions—no extra quiz required.</p></div></section>`;
  }
  function render() {
    document.body.dataset.screen=state.screen;
    app.innerHTML=state.screen==='intro'?intro():state.screen==='primary'?promptScreen('primary'):state.screen==='interlude'?interlude():state.screen==='secondary'?promptScreen('secondary'):results();
    applyTheme(state.screen==='results'?secondaryResults().primary:state.screen==='intro'?previewTheme:'Normal');
    save();
  }
  function navigateTo(screen) { clearTimeout(nextTimer); nextTimer=null; state.screen=screen; render(); window.scrollTo({ top:0, behavior:'instant' }); }
  function back() {
    clearTimeout(nextTimer); nextTimer=null;
    if(state.screen==='primary') { if(state.primaryIndex>0) state.primaryIndex--; else return navigateTo('intro'); }
    else if(state.screen==='interlude') {state.primaryIndex=PRIMARY.length-1; state.screen='primary';}
    else if(state.screen==='secondary') { if(state.secondaryIndex>0) state.secondaryIndex--; else state.screen='interlude'; }
    else if(state.screen==='results') { state.screen='secondary'; state.secondaryIndex=SECONDARY.length-1; }
    render();
  }
  function answer(n) {
    if (nextTimer !== null) return;
    const core=state.screen==='primary';
    if (!core && state.screen!=='secondary') return;
    const index=core?state.primaryIndex:state.secondaryIndex;
    const q=core?PRIMARY[index]:SECONDARY[index];
    if(core && q.kind==='game') return;
    if(n<0 || n>=(core||q.contrast?5:4)) return;
    if(core) state.primaryAnswers[index]=n;
    else state.secondaryAnswers[index]=n;
    render();
    nextTimer=setTimeout(()=>{
      nextTimer=null;
      if(core) { if(state.primaryIndex===PRIMARY.length-1) navigateTo('interlude'); else { state.primaryIndex++; render(); } }
      else { if(state.secondaryIndex===SECONDARY.length-1) navigateTo('results'); else { state.secondaryIndex++; render(); } }
      // Give keyboard users the next prompt without requiring a new mouse target.
      const first=app.querySelector('[data-answer="0"]');
      if (first) first.focus({preventScroll:true});
    },125);
  }
  function reset() {
    if(!window.confirm('Retake the quiz? This will clear your saved answers in this browser.')) return;
    clearTimeout(nextTimer); nextTimer=null; state=fresh(); previewTheme='Normal'; navigateTo('intro');
  }
  async function copyResults() {
    const r=secondaryResults();
    const match=starterMatch(r);
    const text=`My Pokémon typing: ${r.primary}${r.secondary?' / '+r.secondary:''}.\nPrimary identity: ${TYPE_INFO[r.primary].essence}\n${r.secondary?'Secondary dimension: '+TYPE_INFO[r.secondary].do:'Single-type: no second type had enough corroborating evidence.'}\nMy recommended starter: ${match.best.name}.\nPokémon Type Quiz — fan-made 80-question quiz`;
    const label=document.getElementById('copy-feedback');
    try { await navigator.clipboard.writeText(text); if(label) label.textContent='Result copied to clipboard.'; }
    catch { if(label) label.textContent='Clipboard access unavailable. You can select and copy your result from this page.'; }
  }
  document.addEventListener('click',e=>{
    const btn=e.target.closest('button');
    if(!btn) return;
    if(btn.hasAttribute('data-appearance-choice')) {setAppearance(btn.dataset.appearanceChoice);return;}
    if(!app.contains(btn)) return;
    if(btn.hasAttribute('data-answer')) { answer(Number(btn.getAttribute('data-answer'))); return; }
    const action=btn.getAttribute('data-action');
    if(action==='preview-theme' && state.screen==='intro') {
      const type=btn.dataset.type;
      if(TYPES.includes(type)) { previewTheme=type; applyTheme(type); }
    }
    else if(action==='start') navigateTo('primary');
    else if(action==='game-next') { if(GAMES.some(g=>g.id===state.primaryAnswers[0])) {state.primaryIndex=1; render(); window.scrollTo({top:0,behavior:'instant'});} }
    else if(action==='back') back();
    else if(action==='continue-secondary') navigateTo('secondary');
    else if(action==='reset') reset();
    else if(action==='copy') copyResults();
    else if(action==='print') window.print();
  });
  document.addEventListener('change', e=>{
    if(e.target && e.target.id==='game-select' && state.screen==='primary' && state.primaryIndex===0) {
      state.primaryAnswers[0]=GAMES.some(g=>g.id===e.target.value)?e.target.value:null;
      const next=app.querySelector('[data-action="game-next"]');
      if(next) next.disabled=!state.primaryAnswers[0];
      const context=app.querySelector('#game-context');
      if(context) context.textContent=gameContext(state.primaryAnswers[0]);
      save();
    }
  });
  document.addEventListener('keydown',e=>{
    if(!['primary','secondary'].includes(state.screen) || e.altKey || e.ctrlKey || e.metaKey || e.shiftKey || ['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)) return;
    if(state.screen==='primary' && state.primaryIndex===0) return;
    if(/^[1-5]$/.test(e.key)) { const n=Number(e.key)-1; const q=state.screen==='secondary'?SECONDARY[state.secondaryIndex]:null; if(state.screen==='primary'||q.contrast||n<4) { e.preventDefault(); answer(n); } }
    if(e.key==='Backspace') {e.preventDefault();back();}
  });
  // Content integrity checks for future maintainers.
  const valid = PRIMARY.length===50 && SECONDARY.length===30 && PRIMARY[0].kind==='game' && TYPES.every(t=>[2,3].includes(PRIMARY.filter(q=>q.type===t).length)) && LENSES.length===8 && LENSES.every(l=>l.qs.length>=3 && l.qs.filter(q=>q.contrast).length===1);
  if(!valid) console.warn('Quiz question inventory has changed. Review scoring thresholds and on-page counts.');
  window.addEventListener('storage',e=>{ if(e.key===STORAGE_KEY && !nextTimer) {state=restore();render();} });
  render();
  setAppearance(document.documentElement.dataset.appearance);
})();
</script>
</body>
</html>
